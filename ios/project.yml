# XcodeGen spec — run `xcodegen generate` in this directory, then open
# W230.xcodeproj. (brew install xcodegen)
name: W230
options:
  bundleIdPrefix: com.digitwolf
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  W230:
    type: application
    platform: iOS
    sources:
      - path: Sources/W230
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: W230 Gear
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: >-
          W230 Gear connects to the gear indicator on your motorcycle over
          Bluetooth to show diagnostics, calibrate it and install firmware updates.
        UIBackgroundModes: [bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitwolf.w230
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
