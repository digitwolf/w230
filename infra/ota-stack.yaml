AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  W230 gear indicator firmware update endpoint: a private S3 bucket holding
  manifest.json + versioned .bin images, served read-only over HTTPS through
  CloudFront (origin access control, no public bucket). Devices fetch
  https://<distribution>/w230/manifest.json at boot or on request from the app.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name for firmware artifacts.
  Prefix:
    Type: String
    Default: w230
    Description: Key prefix the devices read from (manifest.json lives under it).

Resources:
  FirmwareBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: W230 firmware updates
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: firmware-s3
            DomainName: !GetAtt FirmwareBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: firmware-s3
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Managed "CachingOptimized" policy; objects carry their own
          # Cache-Control (manifest 60 s, images immutable) via release.sh.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FirmwareBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${BucketName}/${Prefix}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref FirmwareBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  ManifestUrl:
    Description: Bake this into the firmware (OTA_MANIFEST_URL in main.rs).
    Value: !Sub "https://${Distribution.DomainName}/${Prefix}/manifest.json"
