[workspace]
resolver = "2"
members = ["core", "esp32"]

# `cargo build` from this directory builds the flashable firmware (`esp32/`); the pure
# logic in `core` is host-testable via `cargo test-host` (see .cargo/config.toml).
default-members = ["esp32"]

[profile.release]
opt-level = "s"
# Line tables only: lets `xtensa-esp32-elf-addr2line` resolve panic
# backtraces to source lines; DWARF stays in the ELF, not in flash.
debug = "line-tables-only"

[profile.dev]
debug = true
opt-level = "z"
