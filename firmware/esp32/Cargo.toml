[package]
name = "w230-gear-indicator"
version = "0.2.2"
authors = ["digitwolf"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/digitwolf/w230"
description = "Kawasaki W230 gear indicator firmware for the M5Stack ATOM Matrix (ESP32)"

[[bin]]
name = "w230-gear-indicator"
path = "src/main.rs"
harness = false

[features]
default = ["std", "esp-idf-svc/native", "esp-idf-svc/experimental"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]

[dependencies]
w230-core = { path = "../core" }
anyhow = "1"
log = "0.4"
# `experimental` unlocks the Bluedroid BLE bindings (bt::ble::gatt::server).
esp-idf-svc = { version = "0.51", default-features = false }
esp-idf-hal = "0.45"
embedded-svc = "0.28"
enumset = "1"
heapless = "0.8"
sha2 = { version = "0.10", default-features = false }
smart-leds = "0.4"
rgb = "0.8"
ws2812-esp32-rmt-driver = { version = "0.12", features = ["smart-leds-trait"] }

[build-dependencies]
embuild = "0.33"
