; Kawasaki W230 Gear Indicator — PlatformIO project
; Reference target: M5Stack Core (ESP32). See docs/03-firmware.md.

[platformio]
default_envs = m5stack-core

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2

[env:m5stack-core]
board = m5stack-core-esp32
lib_deps =
    m5stack/M5Unified@^0.2.7

; Uncomment to build for M5StickC Plus2 instead (adjust pins in src/pins.h).
;[env:m5stickc-plus2]
;board = m5stick-c
;lib_deps =
;    m5stack/M5Unified@^0.2.7
