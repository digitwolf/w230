[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
# scripts/flash.sh = espflash with the ESP-IDF bootloader (rollback support)
# and the two-slot OTA partition table; stays at 115200 baud.
runner = "scripts/flash.sh"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[alias]
# Run the w230-core unit tests on the build machine (the esp toolchain can
# target the host; core has no ESP dependencies).
test-host = "test -p w230-core --target x86_64-unknown-linux-gnu"

[env]
MCU = "esp32"
# ESP-IDF version pinned by esp-idf-svc 0.51
ESP_IDF_VERSION = "v5.3.3"
# Explicit path so the workspace layout can't lose it (resolved relative to
# this config file's directory).
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "sdkconfig.defaults", relative = true }
