[workspace]
resolver = "2"
members = ["core", "firmware"]

# `cargo build` from this directory builds the flashable firmware; the pure
# logic in `core` is host-testable via `cargo test-host` (see .cargo/config.toml).
default-members = ["firmware"]

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
